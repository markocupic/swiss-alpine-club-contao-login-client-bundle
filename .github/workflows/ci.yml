name: CI

on:
    pull_request: ~
    push:
        branches:
            - '*'
        tags:
            - '*'

jobs:
    cs:
        name: Coding Style
        runs-on: ubuntu-latest
        steps:
            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: 8.4
                    coverage: none

            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Install ecs
                run: cd tools/ecs && composer update --no-interaction --no-progress

            -   name: Run the CS fixer
                run: composer cs-fixer

    phpstan:
        name: PHPStan
        runs-on: ubuntu-latest
        steps:
            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: 8.4
                    extensions: dom, fileinfo, filter, hash, intl, json, mbstring, pcre, pdo_mysql, zlib
                    coverage: none

            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Install the dependencies
                run: |
                    composer update --no-interaction --no-progress
                    cd tools/phpstan && composer update --no-interaction --no-progress

            -   name: Run PHPStan
                run: composer phpstan

    tests:
        name: PHP ${{ matrix.php }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: [ 8.4, 8.5 ]
        steps:
            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    extensions: dom, fileinfo, filter, hash, intl, json, mbstring, pcre, pdo_mysql, zlib
                    coverage: none

            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Install phpunit
                run: cd tools/phpunit && composer update --no-interaction --no-progress

            # tools/phpunit uses PHPUnit 9.6 (contao/test-case 5.3). Install Contao 5.3 in the root
            # package as well, so that both use the same PHPUnit version.
            -   name: Install the dependencies
                run: |
                    composer require contao/core-bundle:5.3.* --no-update --no-interaction
                    composer update --no-interaction --no-progress

            -   name: Run the unit tests
                run: composer unit-tests
